name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      # Same auth shim as ci.yml: the `sessionweave-client` dep lives in
      # the private EnzinoBB/SessionWeave repo, which the auto-injected
      # GITHUB_TOKEN cannot read. Inject the SESSIONWEAVE_REPO_TOKEN PAT
      # (read-only on the sibling repo) so pip's git clone authenticates.
      - name: Configure git auth for private cross-repo dep
        run: |
          git config --global url."https://x-access-token:${{ secrets.SESSIONWEAVE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: pip install -e '.[dev]' build
      - run: playwright install chromium --with-deps
      - run: ruff check . && mypy . && pytest -q -m "not fuzz and not e2e"
      - run: pytest tests/e2e -v -m e2e
      - run: python -m build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Forward the PAT to the Dockerfile via a BuildKit secret —
          # the Dockerfile mounts it at /run/secrets/github_token to
          # authenticate the cross-repo private dep clone during
          # `pip wheel`. The secret is NOT baked into image layers.
          secrets: |
            github_token=${{ secrets.SESSIONWEAVE_REPO_TOKEN }}
          tags: |
            ghcr.io/enzinobb/sessionweave:${{ github.ref_name }}
            ghcr.io/enzinobb/sessionweave:latest
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
