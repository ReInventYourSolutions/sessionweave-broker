name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy .
      - run: pytest -q -m "not fuzz"

  cockpit-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install -e '.[dev]'
      - run: playwright install chromium --with-deps
      - run: pytest tests/e2e -v -m e2e
