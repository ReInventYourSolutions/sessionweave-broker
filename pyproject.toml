[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sessionweave"
version = "0.15.0"
description = "MCP-native session relay for multi-agent collaboration"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    "mcp>=1.0",
    "starlette>=0.37,<1.0",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "pydantic>=2.6",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "sessionweave-client @ git+https://github.com/EnzinoBB/SessionWeave.git#subdirectory=SDK/python",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "pytest-playwright>=0.5",
]

[project.scripts]
sessionweave = "sessionweave.main:cli"
sessionweave-join = "sessionweave.launch:main"
sessionweave-host = "sessionweave.host_cli:main"
sessionweave-poller = "sessionweave.poller:main"
sessionweave-agent-runner = "sessionweave.runner.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sessionweave"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# FastMCP's tool decorator detects Context parameters via inspect.isclass,
# which only matches an unparameterized `Context` annotation. Keep the
# bare form here and silence the strict generic-args check for this shim.
module = "sessionweave.server"
disallow_any_generics = false

[[tool.mypy.overrides]]
# sessionweave_client ships no py.typed marker or stubs; ignore missing types.
module = ["sessionweave_client", "sessionweave_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
pythonpath = ["."]
markers = [
    "integration: requires spawning a relay subprocess",
    "property: hypothesis-based",
    "fuzz: concurrency stress (nightly)",
    "e2e: end-to-end tests using a real browser (Playwright)",
]
