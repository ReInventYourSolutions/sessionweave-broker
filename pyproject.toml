[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sessionweave"
version = "0.27.1"
description = "MCP-native session relay for multi-agent collaboration"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    # Migrated to the 2.x API (MCPServer, streamable_http_client, unions that
    # are no longer RootModels). The code will not run on 1.x, and 3.x will be
    # another breaking major — keep the range closed at both ends.
    #
    # The floor is 2.2, not 2.0: streamable_http_app() gained max_sessions in
    # 2.2, and server.py passes it, so build_app() would TypeError at startup
    # on 2.0.x/2.1.x. 2.2 is also the version test_mcp2_sdk_contract.py pins
    # the private ServerSession._connection against.
    "mcp>=2.2,<3",
    "starlette>=0.37,<1.0",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "pydantic>=2.6",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "pytest-playwright>=0.5",
]

[project.scripts]
sessionweave = "sessionweave.main:cli"
sessionweave-join = "sessionweave.launch:main"
sessionweave-host = "sessionweave.host_cli:main"
sessionweave-poller = "sessionweave.poller:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sessionweave"]
artifacts = ["src/sessionweave/persistence_migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored data shipped as package assets (SDK source, web assets) — not the
# broker's own code; don't lint/format it.
extend-exclude = ["src/sessionweave/_data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# Vendored SDK source under _data/ is shipped as data, not type-checked here.
exclude = ["src/sessionweave/_data/"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
# MCPServer's tool decorator detects Context parameters via inspect.isclass,
# which only matches an unparameterized `Context` annotation. Keep the
# bare form here and silence the strict generic-args check for this shim.
module = "sessionweave.server"
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
pythonpath = ["."]
markers = [
    "integration: requires spawning a relay subprocess",
    "property: hypothesis-based",
    "fuzz: concurrency stress (nightly)",
    "e2e: end-to-end tests using a real browser (Playwright)",
]
