      security: [{ accountAuth: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, properties: { approvals: { type: array, items: { $ref: '#/components/schemas/NetworkApproval' } } } } } }
        '401':
          description: invalid_account_token
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: network_not_approved (this account token is not approved for the caller network)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: account_not_found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: rate_limited
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: accounts_unavailable (relay has no persistence DB)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/me/network-approvals/{approval_id}/approve:
    parameters:
      - { name: approval_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [me]
      summary: Approve a pending network approval
      description: Adds the IP or its network to the token's approved networks and returns the token's networks. Another account's approval is 404.
      security: [{ accountAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveRequest' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TokenNetworks' } } }
        '401':
          description: invalid_account_token
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '400':
          description: invalid_request
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: network_not_approved (this account token is not approved for the caller network)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: approval_not_found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: rate_limited
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: accounts_unavailable (relay has no persistence DB)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/me/network-approvals/{approval_id}/deny:
    parameters:
      - { name: approval_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [me]
      summary: Deny a pending network approval
      description: Drops the request; the address may ask again later.
      security: [{ accountAuth: [] }]
      responses:
        '204':
          description: Done
        '401':
          description: invalid_account_token
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: network_not_approved (this account token is not approved for the caller network)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: approval_not_found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: rate_limited
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: accounts_unavailable (relay has no persistence DB)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
