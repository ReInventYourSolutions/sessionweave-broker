openapi: 3.0.3
info:
  title: SessionWeave Relay
  version: "0.35.0"
  description: |
    SessionWeave is a transport-agnostic rendezvous for multi-agent
    collaboration. The relay brokers messages between participants
    inside named **sessions** without holding any agent's history.

    This document describes the **REST surface** at `/v1/...` plus the
    WebSocket events stream. The relay also exposes an MCP catalogue
    at `/mcp` that mirrors every endpoint here as a tool — see the
    repo README for the MCP-side contract.

    **Auth:** every credential is a 256-bit secret sent as
    `Authorization: Bearer <token>` (or `?token=…` on a WebSocket upgrade).
    `POST /v1/sessions` returns an invite link carrying a 15-minute, multi-use
    **join token**, plus a **creator token** and a **supervisor token**.
    Joining needs the join, creator or admin token; the join returns a secret
    **participant token** that authenticates every participant route. The
    relay-wide admin token is the `SW_ADMIN_TOKEN` environment variable (unset
    means no admin access). A session id and a `participant_id` are
    identifiers only; no route accepts either as a credential. Access by role:

    | Operation | participant | join token | supervisor | creator | admin |
    |---|---|---|---|---|---|
    | join | | yes | | yes | yes |
    | read (describe, roster, events, `/invite`) | yes | yes | yes | yes | yes |
    | send / respond / leave | yes | | | | |
    | supervisor notes, firehose | | | yes | yes | yes |
    | purpose update, delete, mint / revoke tokens | | | | yes | yes |
  contact:
    name: SessionWeave
    url: https://sessionweave.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://broker.sessionweave.com
    description: Hosted production broker
  - url: http://127.0.0.1:8765
    description: Local dev relay (default port from `sessionweave --host 127.0.0.1 --port 8765`)

tags:
  - name: meta
    description: Health and discovery
  - name: sessions
    description: Session lifecycle
  - name: participants
    description: Participant lifecycle (join / leave / drain)
  - name: commands
    description: Dispatch and respond
  - name: accounts
    description: Account administration (relay admin token)
  - name: me
    description: Account self-service (account token)
  - name: agents
    description: Agent launchers, discovery and launches (session coordinator)

components:
  securitySchemes:
    adminAuth:
      type: http
      scheme: bearer
      description: The relay admin token (`SW_ADMIN_TOKEN`). Missing -> 401; wrong -> 403.
    accountAuth:
      type: http
      scheme: bearer
      description: |
        An account token (`swa_...`). Valid only while it is not revoked, not
        expired and its account is `active`; otherwise 401 `invalid_account_token`.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A secret token scoped to one session: the participant token returned
        by `POST /v1/sessions/{sid}/participants`, or a join, supervisor or
        creator token returned by `POST /v1/sessions`, or the relay admin
        token. On a session with an owner account, a usable token of that
        account (see `accountAuth`) is accepted wherever the creator token is.
        Each operation states which of these it accepts. The session id and
        the `participant_id` are never accepted.

  schemas:
    Purpose:
      type: object
      description: Session purpose JSON; max 16 KiB. Schema is open by design.
      example:
        kind: tic-tac-toe-v1
        your_role: O
        instructions: X moves first; reply via session_respond, then send your move.
      additionalProperties: true

    SessionConfig:
      type: object
      properties:
        max_participants: { type: integer, example: 16 }
        max_payload_bytes: { type: integer, example: 262144 }
        idle_ttl_seconds: { type: integer, example: 1800 }
        default_command_timeout_seconds: { type: integer, example: 60 }
        max_command_timeout_seconds: { type: integer, example: 300 }
        offline_grace_seconds: { type: integer, example: 300 }
        max_pending_notifications_per_participant: { type: integer, example: 1000 }
        max_launched_agents:
          type: integer
          example: 10
          description: Cap on agents launched into this session through launchers (0 to 100; 0 = none). Launches beyond it are refused.
        max_wait_seconds:
          type: integer
          example: 600
          description: |
            Hard cap (seconds) applied to `session_wait_for_event` over HTTP
            and WebSocket transports. The effective timeout is the minimum of
            the caller-requested value, this cap, and the remaining session
            TTL.
        max_concurrent_waits_total:
          type: integer
          example: 1000
          description: |
            Cap on the number of `session_wait_for_event` callers blocked at
            any moment across all sessions. Requests above this cap return
            ERR_TOO_MANY_WAITERS.
        max_wait_seconds_mcp:
          type: integer
          example: 20
          description: |
            Transport-specific cap applied to `session_wait_for_event` invoked
            over MCP. Tighter than `max_wait_seconds` because many MCP clients
            abort long-running tool calls around the 30-second mark; keeping
            the relay side under that threshold avoids spurious aborts.
            Cross-field invariant: `max_wait_seconds_mcp <= max_wait_seconds`.
        max_buffer_bytes_per_session:
          type: integer
          example: 52428800
          description: |
            Aggregate byte budget across all buffered notifications for
            all participants in this session (default 50 MiB). When
            exceeded, the relay evicts the OLDEST buffered events
            across the session until the budget is met, and emits a
            single `buffer_evicted` event on the firehose with the
            eviction batch summary. Prevents the OOM vector where a
            compromised participant fills its 1000-message count cap
            with max-size payloads on every participant (16 * 1000 *
            256 KiB ~= 4 GiB worst-case absent this guard).
        persistence_db_path: { type: string, example: "data/sessionweave.db" }
        persistence_db_pool_size: { type: integer, example: 4 }
        persistence_sweep_interval_seconds: { type: integer, example: 60 }
        persistence_until_deleted_safety_seconds: { type: integer, example: 7776000 }

    PersistenceConfig:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [ttl, until_deleted]
        ttl_seconds:
          type: integer
          minimum: 3600
          maximum: 7776000

    PersistenceStatePublic:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [ttl, until_deleted]
        expires_at:
          type: string
          format: date-time
          nullable: true

    ParticipantPublic:
      type: object
      properties:
        participant_id: { type: string, format: uuid }
        role: { type: string, nullable: true, example: worker }
        objective: { type: string, nullable: true }
        capabilities:
          type: array
          items: { type: string }
          example: [respond, echo]
        metadata:
          type: object
          additionalProperties: true
        joined_at: { type: string, format: date-time }
        online: { type: boolean }
        supervision_state: { type: string, enum: [active, paused] }

    Session:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        config:
          $ref: '#/components/schemas/SessionConfig'
        purpose:
          $ref: '#/components/schemas/Purpose'
          nullable: true
        roster:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantPublic'
        coordinator_id:
          type: string
          nullable: true
          description: The participant allowed to discover and launch agents; null when none is set.

    JoinRequest:
      type: object
      properties:
        role: { type: string, example: worker }
        objective: { type: string, example: "respond to incoming questions" }
        capabilities:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
        delivery_mode:
          type: string
          enum: [push, pull]
          description: Ignored on REST joins (always pull); honoured on MCP joins.

    JoinResponse:
      type: object
      properties:
        participant_id: { type: string, format: uuid }
        participant_token:
          type: string
          description: |
            Secret bearer token for subsequent participant calls. Returned
            once; unrelated to `participant_id`.
        role: { type: string, nullable: true }
        session_id: { type: string, format: uuid }
        persistence:
          $ref: '#/components/schemas/PersistenceStatePublic'
          nullable: true

    Target:
      type: object
      description: |
        Recipient filter. With `dispatch=specific`, set
        `participant_ids`; with `all` / `any`, set at least one of
        `role` / `capability`.
      properties:
        participant_ids:
          type: array
          items: { type: string, format: uuid }
        role: { type: string }
        capability: { type: string }

    SendCommandRequest:
      type: object
      required: [dispatch, target, payload]
      properties:
        dispatch:
          type: string
          enum: [specific, all, any]
        target:
          $ref: '#/components/schemas/Target'
        payload:
          type: object
          additionalProperties: true
          description: Free-form command body, capped at `max_payload_bytes`.
        timeout_seconds:
          type: integer
          minimum: 1
          description: Clamped to `max_command_timeout_seconds`.

    SendCommandResponse:
      type: object
      properties:
        command_id: { type: string, format: uuid }
        delivered_to:
          type: array
          items: { type: string, format: uuid }

    RespondCommandRequest:
      type: object
      required: [status, payload]
      properties:
        status:
          type: string
          enum: [ok, error]
        payload:
          type: object
          additionalProperties: true

    InboxEvent:
      type: object
      properties:
        name:
          type: string
          enum:
            - participant.joined
            - participant.updated
            - participant.left
            - command.received
            - command.cancelled
            - result.received
            - command.completed
            - session.purpose_updated
            - session.coordinator_changed
            - session.ended
            - supervisor.note
            - agent.launch_failed
            - agent.stopped
        payload:
          type: object
          additionalProperties: true
        seq:
          type: integer
          minimum: 1
          description: |
            Per-participant monotonically increasing sequence number
            assigned by the relay when the event was fanned out. A
            reconnecting client can ack consumed events with
            `{"ack": N}` on the WS upstream or pass `?last_acked_seq=N`
            on the next inbox-drain / WS attach to skip duplicates.
            Optional for backwards-compat: events buffered by older
            builds may be absent.

    InboxDrainResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/InboxEvent'

    InboxWaitRequest:
      type: object
      additionalProperties: false
      properties:
        names:
          type: array
          items: { type: string }
          nullable: true
          description: |
            Optional event-name filter. `null` or `[]` means "wake on
            any event". Otherwise, only events whose `name` matches
            one of the listed strings wake the call; other events
            are silently re-buffered.
        timeout_seconds:
          type: number
          format: float
          minimum: 0
          default: 60
          description: |
            Caller-chosen wall-clock budget. The relay clamps this to
            `min(max_wait_seconds, session_remaining_ttl)`. A value
            of 0 means "drain matching events right now, do not wait"
            — useful as a filtered version of `inbox/drain`.

    InboxWaitResponse:
      type: object
      required: [messages, timed_out, effective_timeout_seconds]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/InboxEvent'
        timed_out:
          type: boolean
          description: |
            True iff the call returned because the `timeout_seconds`
            deadline elapsed without any matching event. When False,
            at least one matching event was delivered.
        effective_timeout_seconds:
          type: number
          format: float
          description: |
            The actual timeout used by the relay for this call, after
            applying transport-specific and session-wide caps. Compare
            to the requested `timeout_seconds` to detect clamping.
            MCP callers are clamped to `max_wait_seconds_mcp` (default
            20s); REST callers are clamped to `max_wait_seconds`
            (default 600s).

    LeaveRequest:
      type: object
      description: Optional body on DELETE /participants/me.
      properties:
        feedback:
          type: object
          description: |
            Structured exit report (4 KiB cap). Skill v0.11.0+ makes
            this part of the standard close-out flow. The relay
            propagates it on the broadcast `participant.left` event.
          additionalProperties: true
          example:
            summary: echo handled 2 commands cleanly
            rating: 5
            issues: []
            metrics:
              commands_received: 2
              commands_responded: 2

    UpdatePurposeRequest:
      type: object
      properties:
        purpose:
          $ref: '#/components/schemas/Purpose'
          nullable: true

    UpdateSelfRequest:
      type: object
      properties:
        role: { type: string }
        objective: { type: string }
        capabilities:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true

    AgentProfile:
      type: object
      description: A profile a launcher can start (never its workdir or start prompt).
      properties:
        launcher_id: { type: string, example: lnc_0123456789abcdef }
        machine: { type: string, description: "Chosen by the launcher's owner: not proof of whose machine it is (see owner / own)" }
        owner: { type: string, nullable: true, description: "The launcher owner's account name (null in open mode)" }
        own: { type: boolean, description: "True when the launcher belongs to the session owner's account (always true in open mode). Discovery lists own launchers first; prefer them — a foreign launcher receives the task and its agent reads the session." }
        profile_id: { type: string }
        domain: { type: string }
        role: { type: string }
        capabilities: { type: array, items: { type: string } }
        description: { type: string }
        runtime: { type: string, enum: [claude, opencode, cline] }
        model: { type: string }
        access_preset: { type: string, enum: [reader, operator] }
        limits: { type: object, additionalProperties: { type: number, nullable: true } }
        online: { type: boolean }
        free_slots: { type: integer }
    LaunchRequest:
      type: object
      required: [task]
      description: Give `launcher_id` + `profile_id`, or `domain` + `role` (the broker picks the first online launcher with a free slot).
      properties:
        launcher_id: { type: string }
        profile_id: { type: string }
        domain: { type: string }
        role: { type: string }
        task: { type: string, maxLength: 16384, description: "What the agent should do (at most 16 KiB UTF-8)" }
    Launch:
      type: object
      required: [launch_id, status, profile_id, launcher_id]
      properties:
        launch_id: { type: string, example: lch_0123456789abcdef }
        status: { type: string, enum: [pending, started, joined, failed, stopped] }
        profile_id: { type: string }
        launcher_id: { type: string }
        machine: { type: string }
        owner: { type: string, nullable: true, description: "The launcher owner's account name (null in open mode)" }
        own: { type: boolean, description: "The launcher belongs to the session owner's account (true in open mode)" }
        participant_id: { type: string, description: Set once the agent joined }
        error: { type: string, description: "Why it failed. Broker: launcher_offline, join_timeout, cancelled. Launcher: invalid_order, launcher_shutting_down, profile_unknown, no_free_slot, visibility_refused, profile_rejected, runtime_unavailable (the runtime failed its preflight: binary missing, unsupported version, unsafe workdir), start_failed, join_failed, join_failed_<http status>, or its stop reason when stopped before joining" }
        message: { type: string, maxLength: 300, description: "The launcher's explanation of a failure (e.g. the runtime version it requires); never local paths or secrets. ASCII printable only: any other character is replaced with '?'" }
        reason: { type: string, description: "Why it stopped. Broker: removed, left, evicted, session_ended, session_cold (a persisted session left memory after its idle TTL; it can be resumed, launch again then), launcher_lost. Launcher: duration_limit, idle_limit, cost_limit, runtime_failed (the runtime kept failing or no longer passes its preflight), agent_exited, agent_failed, launcher_shutdown, launcher_disconnected, launcher_unauthorized, launcher_restarted, launcher_error" }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - session_not_found
                - participant_not_found
                - command_not_found
                - not_in_session
                - already_in_session
                - session_full
                - already_responded
                - not_a_recipient
                - payload_too_large
                - invalid_dispatch_filters
                - invalid_targets
                - invalid_config
                - validation_error
                - invalid_delivery_mode
                - wait_already_in_flight
                - participant_evicted
                - participant_paused
                - participant_removed
                - too_many_waits
                - client_disconnect
                - unauthorized
                - account_token_required
                - invalid_account_token
                - account_not_found
                - account_name_taken
                - accounts_unavailable
                - session_suspended
                - account_session_limit
                - account_token_limit
                - persistence_failed
                - token_not_found
                - invalid_request
                - network_not_approved
                - approval_not_found
                - profile_not_found
                - no_free_slot
                - launch_limit
                - launch_not_found
            message:
              type: string
    Account:
      type: object
      properties:
        account_id: { type: string, example: acc_0123456789abcdef }
        name: { type: string }
        status: { type: string, enum: [pending, active, disabled] }
        contact: { type: string, nullable: true }
        created_by: { type: string }
        created_at: { type: integer, format: int64, description: Unix epoch milliseconds }
    AccountToken:
      type: object
      description: Token metadata. The secret is never returned after minting.
      properties:
        token_id: { type: string }
        account_id: { type: string }
        label: { type: string }
        created_at: { type: integer, format: int64, description: Unix epoch milliseconds }
        expires_at: { type: integer, format: int64, nullable: true, description: Unix epoch milliseconds }
        revoked_at: { type: integer, format: int64, nullable: true, description: Unix epoch milliseconds }
        network_policy: { $ref: '#/components/schemas/NetworkPolicy' }
        approved_networks:
          type: array
          items: { type: string, example: 203.0.113.0/24 }
          description: Approved CIDRs (an exact IP is stored as `/32` or `/128`)
        last_used_at: { type: integer, format: int64, nullable: true, description: Unix epoch milliseconds }
        last_used_ip: { type: string, nullable: true }
    NetworkPolicy:
      type: string
      enum: [any, first_use, approved_only]
      description: |
        `any` (default): no restriction. `first_use`: the network of the first
        successful use is approved automatically, afterwards only approved
        networks work. `approved_only`: only already approved networks work.
    TokenNetworks:
      type: object
      properties:
        network_policy: { $ref: '#/components/schemas/NetworkPolicy' }
        approved_networks: { type: array, items: { type: string } }
    SetTokenNetworksRequest:
      type: object
      description: Every field is optional. `approved_networks` replaces the whole list.
      properties:
        network_policy: { $ref: '#/components/schemas/NetworkPolicy' }
        approved_networks: { type: array, items: { type: string } }
    NetworkApproval:
      type: object
      properties:
        approval_id: { type: string, example: apr_0123456789abcdef }
        token_id: { type: string }
        label: { type: string }
        ip: { type: string }
        client: { type: string, nullable: true, description: User agent / MCP client name+version }
        created_at: { type: integer, format: int64, description: Unix epoch milliseconds }
        expires_at: { type: integer, format: int64, description: Unix epoch milliseconds (24 h after the first attempt) }
    ApproveRequest:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [ip, network]
          description: Approve the exact IP (`/32`, `/128`) or its network (`/24` for IPv4, `/64` for IPv6)
    AccountEvent:
      type: object
      properties:
        event_id: { type: integer, format: int64, description: Monotonic cursor }
        account_id: { type: string }
        kind:
          type: string
          enum:
            - session.created
            - session.deleted
            - token.created
            - token.revoked
            - token.network_pending
            - token.network_approved
            - token.network_denied
            - token.rejected
            - account.status_changed
            - agent.launched
            - agent.stopped
        ts: { type: integer, format: int64, description: Unix epoch milliseconds }
        data: { type: object, additionalProperties: true, description: Never contains token values or join links }
    AccountEventsPage:
      type: object
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/AccountEvent' } }
        next: { type: integer, format: int64, description: Resume cursor (pass as `after`) }
        truncated: { type: boolean, description: "`after` is older than the oldest kept event" }
    AccountWithTokens:
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            tokens:
              type: array
              items: { $ref: '#/components/schemas/AccountToken' }
    CreateAccountRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128, description: Unique across accounts }
        contact: { type: string }
        status: { type: string, enum: [pending, active, disabled], default: active }
        created_by: { type: string, default: admin }
    PatchAccountRequest:
      type: object
      description: Every field is optional; omitted fields are unchanged.
      properties:
        status: { type: string, enum: [pending, active, disabled] }
        name: { type: string, minLength: 1, maxLength: 128 }
        contact: { type: string }
    CreateTokenRequest:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 64 }
        expires_at:
          type: string
          format: date-time
          description: ISO 8601 (a trailing `Z` is accepted); must be in the future. Omit for no expiry.
        network_policy: { $ref: '#/components/schemas/NetworkPolicy' }
        approved_networks:
          type: array
          items: { type: string }
          description: CIDRs or exact IPs the token may be used from
    CreatedToken:
      type: object
      properties:
        token: { type: string, description: The secret, shown only in this response }
        token_id: { type: string }
        label: { type: string }
        created_at: { type: integer, format: int64, description: Unix epoch milliseconds }
        expires_at: { type: integer, format: int64, nullable: true, description: Unix epoch milliseconds }
        network_policy: { $ref: '#/components/schemas/NetworkPolicy' }
        approved_networks: { type: array, items: { type: string } }
    OwnedSession:
      type: object
      properties:
        session_id: { type: string }
        suspended: { type: boolean }
        persisted: { type: boolean }
        purpose: { type: object, nullable: true, additionalProperties: true }

paths:
  /invite/{sid}:
    get:
      summary: Self-describing participation brief (Markdown)
      description: >
        Returns a human/agent-readable Markdown brief: the session's purpose plus the
        exact HTTP recipe to participate in non-blocking pull mode. Read-only,
        allocates no participant. Hand the URL
        https://<host>/invite/<sid>?jt=<join_token> to a bare HTTP agent and it
        can join, exchange, and leave with no SDK/MCP/skill. The `jt` query
        parameter (a join, supervisor, creator or admin token) is required.
      parameters:
        - name: sid
          in: path
          required: true
          schema: { type: string }
        - name: jt
          in: query
          required: true
          schema: { type: string }
          description: The join token carried by the invite link.
      responses:
        '200':
          description: The participation brief.
          content:
            text/markdown:
              schema: { type: string }
        '403':
          description: Missing, invalid or expired `jt`. The page reveals nothing about the session.
          content:
            text/markdown:
              schema: { type: string }
        '404':
          description: Session not found or ended.
        '429':
          description: Too many invalid tokens from this source IP for this session.

  /v1/info:
    get:
      tags: [meta]
      summary: Relay name, version, transport list
      responses:
        '200':
          description: Always 200 while the relay is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string, example: sessionweave }
                  version: { type: string, example: "0.34.0" }
                  subproject: { type: string }
                  auth_model:
                    type: string
                    description: |
                      Identifier for the relay's authentication shape so
                      SDK clients can detect which security guarantees
                      apply. ``scoped-tokens-v1`` means join tokens
                      (15 minutes, multi-use), a secret per-participant
                      token distinct from ``participant_id``, and
                      creator / supervisor / admin tokens (see Threat
                      Model in README).
                    enum: [scoped-tokens-v1]
                  relay_epoch:
                    type: integer
                    description: |
                      Per-process startup time (UNIX seconds at
                      ``build_app``). A change between two polls signals
                      that the relay has restarted — any in-memory state
                      a client remembers (seq cursors, participant_ids,
                      session_ids) is gone. The SDK uses this to invalidate
                      ``last_acked_seq`` on resume after a relay restart.
                  transports:
                    type: array
                    items: { type: string, enum: [mcp, http, ws] }
                  capabilities:
                    type: object
                    description: |
                      Per-feature flags the cockpit and other clients
                      use to decide which endpoints to call. New flags
                      may appear in future versions.
                    properties:
                      firehose: { type: boolean }
                      supervisor_notes: { type: boolean }
                      session_delete: { type: boolean }
                  session_creation:
                    type: string
                    enum: [open, account]
                    description: |
                      Who may create sessions. `open`: anyone (an optional
                      account or admin token makes the caller the owner).
                      `account`: `POST /v1/sessions` needs an account token (or
                      the admin token); otherwise 401 `account_token_required`.

  /v1/sessions:
    post:
      tags: [sessions]
      summary: Create a session
      description: |
        Authentication depends on `session_creation` in `GET /v1/info`. With
        `open` a Bearer is optional: an account token makes that account the
        session's owner, the admin token may set `owner_account_id`. With
        `account` the Bearer is required (an account token, or the admin
        token). A missing token is 401 `account_token_required`; an unknown,
        revoked, expired or inactive account token is 401
        `invalid_account_token`. The response carries every credential for
        the new session, each in plaintext exactly once (only digests are
        stored).
      security:
        - {}
        - accountAuth: []
        - adminAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  $ref: '#/components/schemas/Purpose'
                config:
                  $ref: '#/components/schemas/SessionConfig'
                persistence:
                  $ref: '#/components/schemas/PersistenceConfig'
                owner_account_id:
                  type: string
                  nullable: true
                  description: |
                    Admin token only: create the session owned by this
                    account. If that account is not `active` the session
                    starts suspended. Any other caller gets 403.
                creator_id:
                  type: string
                  nullable: true
                  description: |
                    Optional opaque handle identifying the creator (e.g. a
                    cockpit user_id, or any future authenticated user
                    identity on the relay side). If absent, the relay mints
                    a uuid4 and returns it in the response. Not persisted
                    on the relay in v0.17.0 — clients echo it locally for
                    display; relay-side enforcement (creator-only ops
                    bound to a user identity) is a future change once
                    relay auth lands.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Session'
                properties:
                  persistence:
                    $ref: '#/components/schemas/PersistenceStatePublic'
                    nullable: true
                  creator_token:
                    type: string
                    description: |
                      Secret that authorises managing this session: delete,
                      purpose update, minting and revoking join / supervisor
                      tokens, joining, reading, supervisor notes and the
                      firehose. Store securely; not re-issuable.
                  supervisor_token:
                    type: string
                    description: |
                      Secret that authorises observing (firehose, reads) and
                      posting supervisor notes. Not valid for joining or for
                      management. Revocable by the creator.
                  supervisor_token_id:
                    type: string
                    description: Id of `supervisor_token`, for revocation.
                  join_token:
                    type: string
                    description: |
                      Secret that authorises joining and reading. Valid for
                      15 minutes, multi-use within that window; expiry does
                      not affect participants already joined.
                  join_token_expires_at:
                    type: string
                    description: ISO-8601 expiry of `join_token`.
                  invite_url:
                    type: string
                    description: "`http(s)://host/invite/<sid>?jt=<join_token>`"
                  invite_link:
                    type: string
                    description: "`swv(s)://host/<sid>?jt=<join_token>`"
                  owner_account_id:
                    type: string
                    nullable: true
                    description: Id of the owning account, or null for an unowned session.
                  creator_id:
                    type: string
                    description: |
                      Stable handle for the creator. Either the
                      `creator_id` passed in the request, or a uuid4
                      minted by the relay if none was provided. Echo
                      this back to participants / UIs to show "created
                      by X" without exposing the creator_token.
        '400':
          description: validation_error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: account_token_required (no Bearer on an `account` relay) or invalid_account_token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: "permission_denied (`owner_account_id` without the admin token); network_not_approved (an account token used here is not approved for the caller network)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: account_not_found (unknown `owner_account_id`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            account_session_limit (the owning account already has
            `SW_ACCOUNT_MAX_SESSIONS` live sessions, default 100; end one
            first) or rate_limited (too many invalid account tokens from this
            source IP)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: accounts_unavailable (an account token was sent but the relay has no persistence DB)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { description: "payload_too_large (request body over SW_MAX_REQUEST_BYTES, default 5 MiB)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/sessions/{sid}:
    parameters:
      - name: sid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [sessions]
      summary: Describe a session (read-only)
      description: |
        Bearer: a participant, join, supervisor, creator or admin token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Session'
                properties:
                  persistence:
                    $ref: '#/components/schemas/PersistenceStatePublic'
                    nullable: true
                  suspended:
                    type: boolean
                    description: True while the owning account is disabled.
        '401': { description: Missing bearer }
        '403': { description: "permission_denied (invalid, expired or wrong-role token); network_not_approved (an account token used here is not approved for the caller network)" }
        '404':
          description: session_not_found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [sessions]
      summary: End a session
      description: |
        Delete a session. Authorization: Bearer accepts either the
        per-session creator_token (returned at session_create), the token of
        the owning account, OR the relay-wide SW_ADMIN_TOKEN. Distinct ended_reason
        values: host_deleted (creator_token) vs admin_deleted (admin).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_at: { type: string }
        '401': { description: Missing bearer }
        '403':
          description: "Token is not the creator token or the relay admin token. Body is ``{\"error\": {\"code\", \"message\"}}``; network_not_approved (an account token used here is not approved for the caller network)"
        '404': { description: Session not found }
        '429':
          description: "Too many invalid tokens from this source IP for this session (``rate_limited``). A valid token is never throttled. Body is ``{\"error\": {\"code\", \"message\"}}``."

  /v1/sessions/{sid}/events:
    parameters:
      - name: sid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [sessions]
      summary: "Browse the timeline of a persisted session"
      description: >-
        Bearer: a participant, join, supervisor, creator or admin token.
        Participant and join tokens do not see private supervisor notes
        (``target`` other than ``all``) or their replies, except a
        participant's own.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: after_seq
          schema: { type: integer, minimum: 0 }
        - in: query
          name: before_seq
          schema: { type: integer, minimum: 0 }
        - in: query
          name: kind
          schema: { type: string }
          description: "Comma-separated list of event kinds"
        - in: query
          name: participant_id
          schema: { type: string }
          description: "Comma-separated list of participant_ids"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: "Page of events"
          content:
            application/json:
              schema:
                type: object
                required: [session_id, events, has_more, session_state]
                properties:
                  session_id: { type: string }
                  events:
                    type: array
                    items: { type: object }
                  next_cursor:
                    type: integer
                    nullable: true
                  has_more: { type: boolean }
                  session_state:
                    type: string
                    enum: [hot, cold, ended]
        "404":
          description: "Unknown session"
        "409":
          description: "Session is not persisted (no history)"

  /v1/sessions/{sid}/purpose:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [sessions]
      summary: Update the session's `purpose` (broadcasts session.purpose_updated)
      description: "Bearer: the creator token, the owning account's token or the admin token. A participant may not change the purpose."
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePurposeRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { description: not_in_session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "permission_denied; network_not_approved (an account token used here is not approved for the caller network)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: "payload_too_large (request body over SW_MAX_REQUEST_BYTES, default 5 MiB)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/agents:
    get:
      tags: [agents]
      summary: Discover the agent profiles this session may launch
      description: |
        Bearer: the session coordinator's participant token, or the creator
        token, the owning account's token or the admin token. Anyone else gets
        `permission_denied` with the message `only the session's coordinator
        can request agents — ask the coordinator`. In account mode only
        launchers visible to the session's owner are listed (personal: same
        account; general: any account or the listed account names; a profile
        may override its launcher's visibility). Each item says `owner` and
        `own`; the session owner's own launchers come first.
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: session_id, required: true, schema: { type: string } }
        - { in: query, name: domain, required: true, schema: { type: string }, description: "Case-insensitive; see /v1/agents/domains" }
        - { in: query, name: role, schema: { type: string } }
        - { in: query, name: capability, schema: { type: string } }
      responses:
        '200':
          description: Matching profiles of the online launchers
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents: { type: array, items: { $ref: '#/components/schemas/AgentProfile' } }
        '400': { description: "invalid_request (session_id or domain missing)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "permission_denied", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "session_not_found", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/agents/domains:
    get:
      tags: [agents]
      summary: List the application domains this session may launch agents from
      description: Same credentials and visibility as `GET /v1/agents`.
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: session_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Domains
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains: { type: array, items: { type: string } }
        '403': { description: "permission_denied", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/sessions/{sid}/agents:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [agents]
      summary: Launch an agent profile into the session
      description: |
        By `domain` + `role` the broker picks only among launchers of the
        session owner's account (or open-mode launchers); another account's
        `general` launcher is used only when named with `launcher_id` +
        `profile_id`.

        Bearer: the session coordinator's participant token, or the creator
        token, the owning account's token or the admin token (others:
        `permission_denied`, "only the session's coordinator can request agents
        — ask the coordinator"). The broker re-checks visibility, reserves a
        slot of the profile, counts the launch against the session's
        `max_launched_agents` (pending, started and joined launches count),
        mints a single-use join credential bound to this session and to the
        profile's role and capabilities, and sends the launch order to the
        launcher. The credential is never returned here.

        The agent joins by itself (`POST /v1/sessions/{sid}/participants` with
        the credential as Bearer): its role and capabilities are forced to the
        profile's (the body's are ignored), its metadata carries `launch_id`,
        `launcher_id`, `launcher_machine`, `profile_id` and `launched_by` (the
        coordinator's participant id, or null when the creator/admin launched),
        and neither can be changed later (`launcher_id` / `launcher_machine`
        mean "originally launched by"; the launch status shows the current
        launcher). These five metadata keys are reserved since 0.34.0: they
        are dropped from every join and update_self body. A second join with
        the credential, or a join to another session, is refused.
        A suspended session refuses the launch (`session_suspended`). If the
        agent has not joined within 120 s (`SW_LAUNCH_JOIN_TIMEOUT_S`) the launch fails with
        `join_timeout`, the credential is invalidated and the launcher gets a
        `stop` (reason `join_timeout`). Failures reach the coordinator as a
        session event `agent.launch_failed {launch_id, error}`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LaunchRequest' }
      responses:
        '202':
          description: Order sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  launch_id: { type: string, example: lch_0123456789abcdef }
                  status: { type: string, enum: [pending, failed] }
                  launcher_id: { type: string, description: The launcher that got the order }
                  machine: { type: string }
                  owner: { type: string, nullable: true, description: "The launcher owner's account name (null in open mode)" }
                  own: { type: boolean, description: "The launcher belongs to the session owner's account" }
        '400': { description: "invalid_request (bad selection or task)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "permission_denied", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "session_not_found; profile_not_found (no visible online launcher offers it)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: "launch_limit (max_launched_agents reached); no_free_slot (every matching profile runs max_instances); session_suspended", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/sessions/{sid}/agents/{launch_id}:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: launch_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [agents]
      summary: Read the result of a launch
      description: |
        Same credentials as the launch. Records live in memory; a finished
        launch stays readable for an hour (not across a relay restart).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The launch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Launch' }
        '403': { description: "permission_denied", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "session_not_found; launch_not_found", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/launchers/connect:
    get:
      tags: [agents]
      summary: Launcher WebSocket (upgrade)
      description: |
        A launcher keeps this WebSocket open; it is online while connected.
        Auth: `Authorization: Bearer` — in account mode an account token (the
        launcher belongs to that account), in open mode `SW_LAUNCHER_TOKEN`
        when set (unset: any launcher may register; the broker logs a
        warning). Close codes: 4401 invalid/missing token, 4403 network not
        approved or token revoked / account not active / account deleted /
        network no longer approved (live launchers are dropped), 4401 also
        when the account token expires while connected, 4429 too many
        failed attempts or too many launchers (5 per account; 50 in open mode),
        4400 bad hello, 1009 frame over 256 KiB, 1011 accounts unavailable.

        Frames (JSON text). Launcher → broker: first
        `{"type":"hello","machine","visibility":"personal"|"general","allowed_accounts":[names],"profiles":[...]}`
        (a profile may carry its own `visibility` and `allowed_accounts`,
        overriding the launcher's for that profile);
        then `{"type":"launch_result","launch_id","status":"started"|"failed","error"?,"message"?}`
        (`message`: at most 300 printable characters, kept with the launch
        and sent in `agent.launch_failed`)
        and `{"type":"stopped","launch_id","reason"}` (its own stop, e.g. a
        limit: the broker removes the participant — halt first — and sends the
        session event `agent.stopped {participant_id, launch_id, reason}`).
        Broker → launcher: `{"type":"welcome","launcher_id","rejected":[{id,reason}],"resume_secret","account"}`
        (`account`: the owner account's name, null in open mode),
        `{"type":"ping"}` every 20 s,
        `{"type":"launch","launch_id","session_id","profile_id","task","join_credential","coordinator_id","session_owner","broker_url"?}`
        (`coordinator_id`: who the agent reports its result to — the
        launching coordinator, else the session's coordinator, or null;
        `session_owner`: the session owner's account name, null in open mode,
        for the launcher's own visibility check; `broker_url` only when `SW_PUBLIC_BASE_URL` is configured — never from
        request headers; otherwise the launcher uses the URL it connected to)
        and `{"type":"stop","launch_id","reason"}` with reason `removed`, `left`,
        `evicted`, `session_ended`, `session_cold`, `join_timeout`,
        `launcher_lost` or `unknown_launch`. `welcome` carries `resume_secret` (only its hash is
        kept). On reconnect the hello may carry `"resume_secret"` and
        `"running": [launch_id, ...]`: joined launches whose secret matches
        (account mode: and the same owner account) are re-attached, replacing
        a still-registered old connection (closed 4409) without stopping its
        agents; other ids get an immediate `stop`.
        A launcher that disconnects fails its launches not yet joined with
        `launcher_offline` (slot and session cap released, credential
        invalidated); its joined agents are removed with reason
        `launcher_lost` unless it reconnects within
        `SW_LAUNCHER_RECONNECT_GRACE_S` (default 300 s). Frames over 256 KiB,
        the hello included, close with 1009.
      security:
        - bearerAuth: []
      responses:
        '101': { description: Switching protocols }

  /v1/sessions/{sid}/coordinator:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [sessions]
      summary: Assign, move or clear the session's coordinator (broadcasts session.coordinator_changed)
      description: |
        The coordinator is the only participant allowed to discover and launch agents.
        It is the participant that first joined presenting the creator credential (the
        creator token or the owning account's token); this route assigns another current
        participant, or clears the role with ``participant_id: null``. When the coordinator
        leaves or is removed the role becomes null (no promotion).
        Bearer: the creator token, the owning account's token or the admin token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participant_id]
              properties:
                participant_id: { type: string, nullable: true }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  coordinator_id: { type: string, nullable: true }
        '401': { description: not_in_session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: "permission_denied", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: "participant_not_found (the target is not a current participant)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/sessions/{sid}/supervisor/notes:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [sessions]
      summary: Post a supervisor note / halt / continue / redirect / undo
      description: |
        Bearer: a supervisor token, the creator token, the owning account's
        token or the admin token (``SW_ADMIN_TOKEN``). A participant token is not accepted: participants
        receive supervisor notes, they do not send them. The session id is
        never a credential.

        Server-side invariants (all modes):
          - ``kind`` is restricted to the documented enum
            (``note`` / ``halt`` / ``continue`` / ``redirect`` / ``undo``).
            ``message`` is required for ``note``, ``redirect`` and ``undo``.
            Unknown kinds return 400.
          - ``target`` must equal ``"all"`` or a participant_id
            currently in the session roster.
          - Per-(session, source-ip) rate limit applies (shared with the
            ``session_post_order`` MCP tool).
          - Only the addressed participants change state and receive the
            ``supervisor.note`` event: ``halt`` and ``undo`` pause them, ``continue`` and
            ``redirect`` make them active again, ``note`` changes nothing.
          - The note is persisted in the session timeline (``GET /events``).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, target]
              properties:
                kind: { type: string, enum: [note, halt, continue, redirect, undo] }
                target: { type: string, description: "'all' or a participant_id" }
                message: { type: string, maxLength: 2048 }
      responses:
        '200':
          description: Note delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  note_id: { type: string }
                  kind: { type: string }
                  target: { type: string }
                  message: { type: string, nullable: true }
                  ts_ms: { type: integer }
                  affected:
                    type: array
                    items: { type: string }
                    description: participant_ids whose supervision_state changed
        '400': { description: Malformed request }
        '401': { description: Missing bearer }
        '403': { description: "permission_denied (not a supervisor, creator or admin token); network_not_approved (an account token used here is not approved for the caller network)" }
        '404': { description: Session not found, or participant_not_found for an unknown target }
        '409': { description: "session_suspended (the owner account is disabled)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Rate-limited }
        '413': { description: "payload_too_large (request body over SW_MAX_REQUEST_BYTES, default 5 MiB)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/sessions/{sid}/supervisor/notes/{note_id}/replies:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: note_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Reply in a supervisor note's thread
      description: |
        Participant Bearer token. The thread is flat: reply to the note, not to
        a reply. A note sent to ``all`` is answered in the open (every other
        participant and the firehose receive ``supervisor.note_reply``). A note
        sent to one participant may be answered only by that participant, and
        only the firehose receives the reply. The reply is persisted in the
        session timeline (``GET /events``) and carries the note's ``target``;
        history shows a private note and its replies only to supervision
        holders and the addressed participant.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2048 }
                outcome:
                  type: object
                  description: Optional structured result of an order (used for ``undo``).
                  required: [status]
                  additionalProperties: false
                  properties:
                    status: { type: string, enum: [done, partial, impossible] }
                    undone: { type: array, items: { type: string } }
                    not_reversible: { type: array, items: { type: string } }
      responses:
        '201':
          description: Reply delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply_id: { type: string }
                  note_id: { type: string }
                  target: { type: string, description: "The note's target: ``all`` or a participant id" }
                  participant_id: { type: string }
                  message: { type: string }
                  ts_ms: { type: integer }
                  outcome: { type: object, description: "Echoed when the request carried one" }
        '400': { description: Empty or oversized message, or invalid outcome }
        '401': { description: Missing or invalid participant token }
        '403': { description: "permission_denied (private note addressed to another participant); network_not_approved (an account token used here is not approved for the caller network)" }
        '404': { description: note_not_found }
        '413': { description: "payload_too_large (request body over SW_MAX_REQUEST_BYTES, default 5 MiB)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/sessions/{sid}/join-tokens:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [sessions]
      summary: Mint a fresh join token
      description: |
        Bearer: the creator token, the owning account's token or the admin
        token. The new token is valid
        for 15 minutes and multi-use within that window; earlier join tokens
        keep their own expiry. The plaintext is returned once.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  join_token: { type: string }
                  expires_at: { type: string }
                  invite_url: { type: string }
                  invite_link: { type: string }
        '401': { description: Missing bearer }
        '403': { description: "permission_denied; network_not_approved (an account token used here is not approved for the caller network)" }
        '404': { description: session_not_found }
        '409': { description: "session_suspended (the owner account is disabled)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Too many invalid tokens from this source IP for this session }
        '413': { description: "payload_too_large (request body over SW_MAX_REQUEST_BYTES, default 5 MiB)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/sessions/{sid}/supervisor-tokens:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [sessions]
      summary: Mint an additional supervisor token
      description: "Bearer: the creator token, the owning account's token or the admin token. The plaintext is returned once."
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_id: { type: string }
                  supervisor_token: { type: string }
        '401': { description: Missing bearer }
        '403': { description: "permission_denied; network_not_approved (an account token used here is not approved for the caller network)" }
        '404': { description: session_not_found }
        '413': { description: "payload_too_large (request body over SW_MAX_REQUEST_BYTES, default 5 MiB)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [sessions]
      summary: List supervisor tokens (ids and timestamps only, never secrets)
      description: "Bearer: the creator token, the owning account's token or the admin token."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Supervisor tokens, including revoked ones
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    token_id: { type: string }
                    created_at: { type: string }
                    revoked_at: { type: string, nullable: true }
        '401': { description: Missing bearer }
        '403': { description: "permission_denied; network_not_approved (an account token used here is not approved for the caller network)" }
        '404': { description: session_not_found }

  /v1/sessions/{sid}/supervisor-tokens/{token_id}:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: token_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [sessions]
      summary: Revoke a supervisor token
      description: "Bearer: the creator token, the owning account's token or the admin token. Revocation is immediate: firehose streams opened with this token are closed (WebSocket close code 4403, reason `supervisor token revoked`)."
      security:
        - bearerAuth: []
      responses:
        '204': { description: Revoked }
        '401': { description: Missing bearer }
        '403': { description: "permission_denied; network_not_approved (an account token used here is not approved for the caller network)" }
        '404': { description: session_not_found or unknown token_id }

  /v1/sessions/{sid}/access:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [sessions]
      summary: Which role does the presented Bearer hold in this session
      description: |
        Lets a client (such as the Cockpit) check a pasted token before
        binding to it. Never reveals anything beyond the role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The role
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    type: string
                    enum: [participant, joiner, supervisor, creator, admin]
                  participant_id: { type: string, nullable: true }
        '401': { description: Missing bearer }
        '403': { description: "permission_denied (unknown or expired token); network_not_approved (an account token used here is not approved for the caller network)" }
        '404': { description: session_not_found }

  /v1/sessions/{sid}/participants:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [participants]
      summary: Join a session
      description: |
        Bearer is a join token (or the creator, owning-account or admin token). The response's
        `participant_token` is the secret Bearer for all later participant
        routes; `participant_id` is an identifier only and authenticates nothing.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinRequest' }
      responses:
        '201':
          description: Joined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinResponse' }
        '401':
          description: Missing Authorization header
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: "permission_denied (invalid, wrong-role or expired join token; a supervisor token cannot join); network_not_approved (an account token used here is not approved for the caller network)"
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: session_not_found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: session_full | session_suspended (the owner account is disabled)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413': { description: "payload_too_large (request body over SW_MAX_REQUEST_BYTES, default 5 MiB)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [participants]
      summary: List the session roster
      description: "Bearer: a participant, join, supervisor, creator or admin token."
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Roster
          content:
            application/json:
              schema:
                type: object
                properties:
                  roster:
                    type: array
                    items: { $ref: '#/components/schemas/ParticipantPublic' }
                  coordinator_id: { type: string, nullable: true }
        '401':
          description: not_in_session
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/sessions/{sid}/participants/me:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [participants]
      summary: Update your participant record (broadcasts participant.updated)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSelfRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantPublic' }
        '413': { description: "payload_too_large (request body over SW_MAX_REQUEST_BYTES, default 5 MiB)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [participants]
      summary: Leave the session — optionally with structured `feedback`
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveRequest' }
      responses:
        '204':
          description: Left
        '413':
          description: payload_too_large (feedback over 4 KiB)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/sessions/{sid}/participants/{pid}:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: pid, in: path, required: true, schema: { type: string } }
    delete:
      tags: [participants]
      summary: Remove an agent from the session (creator or admin; the coordinator for launched agents)
      description: |
        Bearer: the creator token, the owning account's token or the admin
        token; the session coordinator's participant token may remove only
        launched agents (`metadata.launch_id` set) — its own, those the
        creator/admin launched and those a previous coordinator launched; a
        supervisor token is
        refused. A launched agent's launcher receives a `stop` order (reason
        `removed`); removing a launched agent does not invalidate the join
        tokens. The agent first receives a `supervisor.note` of kind `halt`
        (message `removed by the session creator`); as with any halt, the
        other participants and the firehose then see `participant.updated`
        with `supervision_state: paused` for it (unless it was already
        paused). It then leaves: its open events WebSocket closes with code
        4410 (reason `removed`), the commands it sent are cancelled, and the
        other participants and the firehose receive `participant.left` with
        reason `removed`. Every still-valid join token of the session (not when the removed participant is a launched agent) is
        invalidated: joining with one answers "join link expired" (after a
        relay restart such a link reads as an invalid token instead, like
        any expired link). Only the addressed participant is affected. The
        join-token cut-off and the removal are written to disk before the
        response; if that write fails nothing has changed and the call can
        be retried.

        For one hour (in memory; not across a relay restart, where it is a
        plain `not_in_session`) any call made with the removed participant's
        token — REST, MCP with an explicit `participant_token`, resume, inbox
        drain / wait, events WebSocket (closed 4410) — answers 403
        `participant_removed` with the message "you were removed from this
        session by its creator — stop your work and your sub-agents".
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: array, items: { type: string } }
                  join_tokens_invalidated: { type: integer }
        '403': { description: "permission_denied (not the creator or admin token); network_not_approved (an account token used here is not approved for the caller network)" }
        '404':
          description: session_not_found or participant_not_found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/sessions/{sid}/participants/me/inbox/drain:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [participants]
      summary: Drain pending events for the calling participant
      description: |
        Drain (and remove from the per-participant buffer) every
        notification queued for the calling participant. Each returned
        message carries an integer `seq` field (per-participant
        monotonically increasing). A client that has already consumed
        events up to ``seq=N`` over some other channel (typically a
        WebSocket that died mid-stream) can pass `?last_acked_seq=N`
        to skip those events on this drain.
      security:
        - bearerAuth: []
      parameters:
        - name: last_acked_seq
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: |
            Highest `seq` the caller has already consumed in memory.
            Buffered events with `seq <= last_acked_seq` are filtered
            out of the drained set. Invalid integers are ignored
            (full-drain fallback).
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxDrainResponse' }
        '401':
          description: not_in_session
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413': { description: "payload_too_large (request body over SW_MAX_REQUEST_BYTES, default 5 MiB)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/sessions/{sid}/participants/me/inbox/wait:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [participants]
      summary: Blocking long-poll for events on the participant's inbox
      description: |
        Pull-mode only. Block until ≥1 buffered event matches the
        optional `names` filter (or `timeout_seconds` elapses), then
        return all matching events and re-buffer the rest. The
        response shape mirrors `inbox/drain` plus a `timed_out`
        flag distinguishing a real event delivery from a clean
        timeout.

        **Client-disconnect handling (relay 0.17.3+).** The relay
        polls the ASGI receive channel for `http.disconnect` events
        while the wait blocks. If the client closes the TCP
        connection before the server-side budget elapses (e.g. an
        HTTP client whose read timeout is shorter than
        `timeout_seconds`), the wait is cancelled, the participant's
        in-flight flag is cleared, and the relay returns
        HTTP `499 client_disconnect` — the client never sees the
        body, but the status code makes the log line unambiguous and
        a subsequent `inbox/wait` from the same participant proceeds
        normally instead of cascading with `409 wait_already_in_flight`.
        Set your HTTP client's read timeout to at least
        `timeout_seconds + a few seconds of slack` to avoid this
        signal turning into per-call churn.

        **Session end and removal.** If the session ends while you wait
        (deleted by its creator, expired), the wait returns the terminal
        `session.ended` event, whatever `names` asked for: stop, do not
        leave. If the creator removes you while you wait, the events queued
        before the removal (the `halt` note) are returned; your next call
        answers `403 participant_removed`. `participant_evicted` (409) means you
        were evicted (offline timeout, full buffer) or left through another
        channel mid-wait.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxWaitRequest' }
      responses:
        '200':
          description: Events or timeout (both success)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxWaitResponse' }
        '400':
          description: invalid_payload
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: bearer does not match participant
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: session_not_found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: invalid_delivery_mode | wait_already_in_flight | participant_evicted (evicted, or you left through another channel)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: too_many_waits — relay concurrent-wait cap exceeded
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '499':
          description: |
            client_disconnect — the relay observed the client close the
            TCP connection before the wait completed and cancelled the
            wait so subsequent calls don't see `wait_already_in_flight`.
            The client never reads this body in practice.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413': { description: "payload_too_large (request body over SW_MAX_REQUEST_BYTES, default 5 MiB)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/sessions/{sid}/participants/me/events:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
      - name: token
        in: query
        required: true
        schema: { type: string }
        description: |
          The participant token returned by the join (not the
          `participant_id`). Required here because browsers can't set custom
          headers on a WebSocket upgrade.
    get:
      tags: [participants]
      summary: WebSocket events stream — upgrade to wss/ws
      description: |
        Each frame is one JSON object `{"name": "<event>", "payload":
        {...}}` matching the inbox-drain schema. The relay drains any
        pending buffered events at attach time and forwards them over
        the socket before the live stream begins.

        On disconnect, in-flight events the relay had handed to the
        WS subscriber but couldn't actually deliver are pushed back to
        the per-participant buffer; reconnect or call `inbox/drain` to
        recover.
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)

  /v1/sessions/{sid}/firehose:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
      - name: token
        in: query
        required: true
        schema: { type: string }
        description: |
          Authentication token, required as a query param because
          browsers can't set custom headers on a WebSocket upgrade.

          Accepted: a supervisor token or the creator token of *this*
          session (also the owning account's token), or the relay-wide admin
          token (``SW_ADMIN_TOKEN``). A stream opened with an account token is
          closed (code 4403) when that token is revoked or its account is
          disabled or deleted. The
          session id is never a credential, and neither is a participant
          token (a participant sees its own stream on ``/events``).
          Verified against stored SHA-256 digests.
    get:
      tags: [sessions]
      summary: WebSocket — full event stream for the session (non-participant)
      description: |
        HTTP/WS upgrade. Authentication via the ``token`` query
        parameter — see the parameter description for the two
        accepted tokens (supervisor / creator / admin). An account token
        used from a network it is not approved for is refused (the
        upgrade fails with 403; an already-open stream is closed with code
        4403, reason `network not approved`). Frames are JSON
        ``{name, payload}`` objects, matching the participant inbox
        shape.

        **Overlap semantics.** The firehose carries every event the
        relay fans out for this session. Per-participant subscribers
        (the ``/events`` WS, ``inbox/drain``, MCP push) receive only
        the events targeted at their participant_id. The two streams
        MAY overlap: a participant that opens its own ``/events`` WS
        AND is also handed a supervisor token and subscribes to the firehose will observe
        the same event on both channels. Consumers that subscribe to
        both MUST dedupe by event identity (``command_id`` for
        command-lifecycle events, ``participant_id`` + event name
        for participant events, etc.). The relay does NOT enforce
        disjointness.

        One concrete example: ``command.completed
        reason="sender_gone"`` is delivered both to the firehose and
        to each responder's per-participant inbox (since #51). A
        responder that also subscribes to the firehose will see the
        event twice and is expected to dedupe.
      responses:
        '101': { description: Switching Protocols (WebSocket) }

  /v1/sessions/{sid}/commands:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [commands]
      summary: Dispatch a command
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendCommandRequest' }
      responses:
        '201':
          description: Dispatched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendCommandResponse' }
        '409':
          description: >-
            session_suspended (the owner account is disabled), or
            participant_paused — a specific target is paused by the supervisor,
            or every role / capability match is. Paused participants are never
            matched by role or capability. Presence does not count here: an
            ``any`` dispatch whose only online matches are paused, while an
            active match is offline, is not refused — it closes with
            ``command.completed`` reason ``no_recipients``, like any ``any``
            that finds nobody online.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413':
          description: payload_too_large
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: invalid_dispatch_filters / invalid_targets
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/sessions/{sid}/commands/{cid}/responses:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [commands]
      summary: Respond to a command
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RespondCommandRequest' }
      responses:
        '201':
          description: Recorded
        '404':
          description: command_not_found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: already_responded
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: not_a_recipient
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413': { description: "payload_too_large (request body over SW_MAX_REQUEST_BYTES, default 5 MiB)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/accounts:
    post:
      tags: [accounts]
      summary: Create an account
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
        '400':
          description: invalid_request
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: account_name_taken
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401':
          description: unauthorized (no Bearer header)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: permission_denied (not the admin token)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: rate_limited (too many failed attempts from this source IP)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: accounts_unavailable (relay has no persistence DB)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413': { description: "payload_too_large (request body over SW_MAX_REQUEST_BYTES, default 5 MiB)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [accounts]
      summary: List accounts
      security: [{ adminAuth: [] }]
      responses:
        '200':
          description: All accounts, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
        '401':
          description: unauthorized (no Bearer header)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: permission_denied (not the admin token)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: rate_limited (too many failed attempts from this source IP)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: accounts_unavailable (relay has no persistence DB)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/accounts/{account_id}:
    parameters:
      - { name: account_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [accounts]
      summary: Show an account with its token metadata
      security: [{ adminAuth: [] }]
      responses:
        '200':
          description: The account
          content: { application/json: { schema: { $ref: '#/components/schemas/AccountWithTokens' } } }
        '401':
          description: unauthorized (no Bearer header)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: permission_denied (not the admin token)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: account_not_found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: rate_limited (too many failed attempts from this source IP)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: accounts_unavailable (relay has no persistence DB)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    patch:
      tags: [accounts]
      summary: Update an account (disable / enable / rename)
      description: |
        The new status is stored first, so the account's tokens stop (or start)
        working at once. Then the account's sessions follow: target `disabled`
        suspends them (participants get a halt note, joins and commands are
        refused), target `active` lifts the suspension and restarts their idle TTL
        but sends no order: halted participants stay paused until a supervisor,
        the creator or the owner posts `continue`. Both are idempotent, so
        repeating the call repairs a partial failure. `pending` does not touch
        sessions. `sessions_affected` is the number of sessions processed.
        If any session fails, the answer is 503 `persistence_failed` and the
        stored status stays.
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchAccountRequest' }
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Account'
                  - type: object
                    properties:
                      sessions_affected: { type: integer }
        '400':
          description: invalid_request
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401':
          description: unauthorized (no Bearer header)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: permission_denied (not the admin token)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: account_not_found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: account_name_taken
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: rate_limited (too many failed attempts from this source IP)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: accounts_unavailable (relay has no persistence DB)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413': { description: "payload_too_large (request body over SW_MAX_REQUEST_BYTES, default 5 MiB)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [accounts]
      summary: Delete an account and all its sessions
      description: |
        Deletes every session the account owns (ended ones included), then the
        account and its tokens. If any session cannot be deleted the answer is
        503 `persistence_failed` and the account is kept; retry to finish.
        To keep the sessions, disable the account instead.
      security: [{ adminAuth: [] }]
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_sessions: { type: integer }
        '401':
          description: unauthorized (no Bearer header)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: permission_denied (not the admin token)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: account_not_found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: rate_limited (too many failed attempts from this source IP)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: accounts_unavailable (relay has no persistence DB)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

