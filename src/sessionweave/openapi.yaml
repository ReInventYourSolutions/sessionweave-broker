openapi: 3.0.3
info:
  title: SessionWeave Relay
  version: "0.18.0"
  description: |
    SessionWeave is a transport-agnostic rendezvous for multi-agent
    collaboration. The relay brokers messages between participants
    inside named **sessions** without holding any agent's history.

    This document describes the **REST surface** at `/v1/...` plus the
    WebSocket events stream. The relay also exposes an MCP catalogue
    at `/mcp` that mirrors every endpoint here as a tool — see the
    repo README for the MCP-side contract.

    **Auth (sub-project #1):** the bearer token IS the `participant_id`
    returned on join. Send as `Authorization: Bearer <participant_id>`
    on every authenticated route, or as the `?token=…` query parameter
    on the WebSocket upgrade. Sub-project #3 will swap this for a JWT
    without changing the surface.
  contact:
    name: SessionWeave
    url: https://sessionweave.com
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://relay.sessionweave.com
    description: Hosted production relay
  - url: http://127.0.0.1:8765
    description: Local dev relay (default port from `sessionweave --host 127.0.0.1 --port 8765`)

tags:
  - name: meta
    description: Health and discovery
  - name: sessions
    description: Session lifecycle
  - name: participants
    description: Participant lifecycle (join / leave / drain)
  - name: commands
    description: Dispatch and respond

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token (= `participant_id` in sub-project #1) returned by
        `POST /v1/sessions/{sid}/participants`.
    BearerSessionId:
      type: http
      scheme: bearer
      description: |
        Bearer token equal to the ``session_id``. Used by cockpit-side
        endpoints (firehose, supervisor notes, end session).

  schemas:
    Purpose:
      type: object
      description: Session purpose JSON; max 16 KiB. Schema is open by design.
      example:
        kind: tic-tac-toe-v1
        your_role: O
        instructions: X moves first; reply via session_respond, then send your move.
      additionalProperties: true

    SessionConfig:
      type: object
      properties:
        max_participants: { type: integer, example: 16 }
        max_payload_bytes: { type: integer, example: 262144 }
        idle_ttl_seconds: { type: integer, example: 1800 }
        default_command_timeout_seconds: { type: integer, example: 60 }
        max_command_timeout_seconds: { type: integer, example: 300 }
        offline_grace_seconds: { type: integer, example: 300 }
        max_pending_notifications_per_participant: { type: integer, example: 1000 }
        max_wait_seconds:
          type: integer
          example: 600
          description: |
            Hard cap (seconds) applied to `session_wait_for_event` over HTTP
            and WebSocket transports. The effective timeout is the minimum of
            the caller-requested value, this cap, and the remaining session
            TTL.
        max_concurrent_waits_total:
          type: integer
          example: 1000
          description: |
            Cap on the number of `session_wait_for_event` callers blocked at
            any moment across all sessions. Requests above this cap return
            ERR_TOO_MANY_WAITERS.
        max_wait_seconds_mcp:
          type: integer
          example: 20
          description: |
            Transport-specific cap applied to `session_wait_for_event` invoked
            over MCP. Tighter than `max_wait_seconds` because many MCP clients
            abort long-running tool calls around the 30-second mark; keeping
            the relay side under that threshold avoids spurious aborts.
            Cross-field invariant: `max_wait_seconds_mcp <= max_wait_seconds`.
        max_buffer_bytes_per_session:
          type: integer
          example: 52428800
          description: |
            Aggregate byte budget across all buffered notifications for
            all participants in this session (default 50 MiB). When
            exceeded, the relay evicts the OLDEST buffered events
            across the session until the budget is met, and emits a
            single `buffer_evicted` event on the firehose with the
            eviction batch summary. Prevents the OOM vector where a
            compromised participant fills its 1000-message count cap
            with max-size payloads on every participant (16 * 1000 *
            256 KiB ~= 4 GiB worst-case absent this guard).
        persistence_db_path: { type: string, example: "data/sessionweave.db" }
        persistence_db_pool_size: { type: integer, example: 4 }
        persistence_sweep_interval_seconds: { type: integer, example: 60 }
        persistence_until_deleted_safety_seconds: { type: integer, example: 7776000 }

    PersistenceConfig:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [ttl, until_deleted]
        ttl_seconds:
          type: integer
          minimum: 3600
          maximum: 7776000

    PersistenceStatePublic:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [ttl, until_deleted]
        expires_at:
          type: string
          format: date-time
          nullable: true

    ParticipantPublic:
      type: object
      properties:
        participant_id: { type: string, format: uuid }
        role: { type: string, nullable: true, example: worker }
        objective: { type: string, nullable: true }
        capabilities:
          type: array
          items: { type: string }
          example: [respond, echo]
        metadata:
          type: object
          additionalProperties: true
        joined_at: { type: string, format: date-time }
        online: { type: boolean }

    Session:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        config:
          $ref: '#/components/schemas/SessionConfig'
        purpose:
          $ref: '#/components/schemas/Purpose'
          nullable: true
        roster:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantPublic'

    JoinRequest:
      type: object
      properties:
        role: { type: string, example: worker }
        objective: { type: string, example: "respond to incoming questions" }
        capabilities:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
        delivery_mode:
          type: string
          enum: [push, pull]
          description: Ignored on REST joins (always pull); honoured on MCP joins.

    JoinResponse:
      type: object
      properties:
        participant_id: { type: string, format: uuid }
        participant_token:
          type: string
          format: uuid
          description: |
            The bearer token to use on subsequent authenticated calls.
            Equal to `participant_id` in sub-project #1.
        role: { type: string, nullable: true }
        session_id: { type: string, format: uuid }
        persistence:
          $ref: '#/components/schemas/PersistenceStatePublic'
          nullable: true

    Target:
      type: object
      description: |
        Recipient filter. With `dispatch=specific`, set
        `participant_ids`; with `all` / `any`, set at least one of
        `role` / `capability`.
      properties:
        participant_ids:
          type: array
          items: { type: string, format: uuid }
        role: { type: string }
        capability: { type: string }

    SendCommandRequest:
      type: object
      required: [dispatch, target, payload]
      properties:
        dispatch:
          type: string
          enum: [specific, all, any]
        target:
          $ref: '#/components/schemas/Target'
        payload:
          type: object
          additionalProperties: true
          description: Free-form command body, capped at `max_payload_bytes`.
        timeout_seconds:
          type: integer
          minimum: 1
          description: Clamped to `max_command_timeout_seconds`.

    SendCommandResponse:
      type: object
      properties:
        command_id: { type: string, format: uuid }
        delivered_to:
          type: array
          items: { type: string, format: uuid }

    RespondCommandRequest:
      type: object
      required: [status, payload]
      properties:
        status:
          type: string
          enum: [ok, error]
        payload:
          type: object
          additionalProperties: true

    InboxEvent:
      type: object
      properties:
        name:
          type: string
          enum:
            - participant.joined
            - participant.updated
            - participant.left
            - command.received
            - command.cancelled
            - result.received
            - command.completed
            - session.purpose_updated
            - session.ended
            - supervisor.note
        payload:
          type: object
          additionalProperties: true
        seq:
          type: integer
          minimum: 1
          description: |
            Per-participant monotonically increasing sequence number
            assigned by the relay when the event was fanned out. A
            reconnecting client can ack consumed events with
            `{"ack": N}` on the WS upstream or pass `?last_acked_seq=N`
            on the next inbox-drain / WS attach to skip duplicates.
            Optional for backwards-compat: events buffered by older
            builds may be absent.

    InboxDrainResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/InboxEvent'

    InboxWaitRequest:
      type: object
      additionalProperties: false
      properties:
        names:
          type: array
          items: { type: string }
          nullable: true
          description: |
            Optional event-name filter. `null` or `[]` means "wake on
            any event". Otherwise, only events whose `name` matches
            one of the listed strings wake the call; other events
            are silently re-buffered.
        timeout_seconds:
          type: number
          format: float
          minimum: 0
          default: 60
          description: |
            Caller-chosen wall-clock budget. The relay clamps this to
            `min(max_wait_seconds, session_remaining_ttl)`. A value
            of 0 means "drain matching events right now, do not wait"
            — useful as a filtered version of `inbox/drain`.

    InboxWaitResponse:
      type: object
      required: [messages, timed_out, effective_timeout_seconds]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/InboxEvent'
        timed_out:
          type: boolean
          description: |
            True iff the call returned because the `timeout_seconds`
            deadline elapsed without any matching event. When False,
            at least one matching event was delivered.
        effective_timeout_seconds:
          type: number
          format: float
          description: |
            The actual timeout used by the relay for this call, after
            applying transport-specific and session-wide caps. Compare
            to the requested `timeout_seconds` to detect clamping.
            MCP callers are clamped to `max_wait_seconds_mcp` (default
            20s); REST callers are clamped to `max_wait_seconds`
            (default 600s).

    LeaveRequest:
      type: object
      description: Optional body on DELETE /participants/me.
      properties:
        feedback:
          type: object
          description: |
            Structured exit report (4 KiB cap). Skill v0.11.0+ makes
            this part of the standard close-out flow. The relay
            propagates it on the broadcast `participant.left` event.
          additionalProperties: true
          example:
            summary: echo handled 2 commands cleanly
            rating: 5
            issues: []
            metrics:
              commands_received: 2
              commands_responded: 2

    UpdatePurposeRequest:
      type: object
      properties:
        purpose:
          $ref: '#/components/schemas/Purpose'
          nullable: true

    UpdateSelfRequest:
      type: object
      properties:
        role: { type: string }
        objective: { type: string }
        capabilities:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - session_not_found
                - participant_not_found
                - command_not_found
                - not_in_session
                - already_in_session
                - session_full
                - already_responded
                - not_a_recipient
                - payload_too_large
                - invalid_dispatch_filters
                - invalid_targets
                - invalid_config
                - validation_error
                - invalid_delivery_mode
                - wait_already_in_flight
                - participant_evicted
                - too_many_waits
                - client_disconnect
            message:
              type: string

paths:
  /v1/info:
    get:
      tags: [meta]
      summary: Relay name, version, transport list
      responses:
        '200':
          description: Always 200 while the relay is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string, example: sessionweave }
                  version: { type: string, example: "0.16.0" }
                  subproject: { type: string }
                  auth_model:
                    type: string
                    description: |
                      Identifier for the relay's authentication shape so
                      SDK clients can detect which security guarantees
                      apply. ``shared-bearer-sub-project-1`` means
                      bearer-token equals ``participant_id`` with no
                      rotation, expiry, or scope (see Threat Model in
                      README). Sub-project #3 will return a different
                      string (TBD) when JWT-scoped tokens land.
                    enum: [shared-bearer-sub-project-1]
                  relay_epoch:
                    type: integer
                    description: |
                      Per-process startup time (UNIX seconds at
                      ``build_app``). A change between two polls signals
                      that the relay has restarted — any in-memory state
                      a client remembers (seq cursors, participant_ids,
                      session_ids) is gone. The SDK uses this to invalidate
                      ``last_acked_seq`` on resume after a relay restart.
                  transports:
                    type: array
                    items: { type: string, enum: [mcp, http, ws] }
                  capabilities:
                    type: object
                    description: |
                      Per-feature flags the cockpit and other clients
                      use to decide which endpoints to call. New flags
                      may appear in future versions.
                    properties:
                      firehose: { type: boolean }
                      supervisor_notes: { type: boolean }
                      session_delete: { type: boolean }

  /v1/sessions:
    post:
      tags: [sessions]
      summary: Create a session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  $ref: '#/components/schemas/Purpose'
                config:
                  $ref: '#/components/schemas/SessionConfig'
                persistence:
                  $ref: '#/components/schemas/PersistenceConfig'
                creator_id:
                  type: string
                  nullable: true
                  description: |
                    Optional opaque handle identifying the creator (e.g. a
                    cockpit user_id, or any future authenticated user
                    identity on the relay side). If absent, the relay mints
                    a uuid4 and returns it in the response. Not persisted
                    on the relay in v0.17.0 — clients echo it locally for
                    display; relay-side enforcement (creator-only ops
                    bound to a user identity) is a future change once
                    relay auth lands.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Session'
                properties:
                  persistence:
                    $ref: '#/components/schemas/PersistenceStatePublic'
                    nullable: true
                  creator_token:
                    type: string
                    description: |
                      Opaque token that authorises the creator as the
                      supervisor of this session: accepted on
                      DELETE /v1/sessions/{sid} (end session), on
                      POST /v1/sessions/{sid}/supervisor/notes, AND on
                      the /v1/sessions/{sid}/firehose WebSocket (see
                      that endpoint's `token` description). Store
                      securely; not re-issuable.
                  creator_id:
                    type: string
                    description: |
                      Stable handle for the creator. Either the
                      `creator_id` passed in the request, or a uuid4
                      minted by the relay if none was provided. Echo
                      this back to participants / UIs to show "created
                      by X" without exposing the creator_token.
        '400':
          description: validation_error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/sessions/{sid}:
    parameters:
      - name: sid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [sessions]
      summary: Describe a session (read-only)
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Session'
                properties:
                  persistence:
                    $ref: '#/components/schemas/PersistenceStatePublic'
                    nullable: true
        '404':
          description: session_not_found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [sessions]
      summary: End a session
      description: |
        Delete a session. Authorization: Bearer accepts either the
        per-session creator_token (returned at session_create) OR the
        relay-wide SW_SUPERVISOR_ADMIN_TOKEN. Distinct ended_reason
        values: host_deleted (creator_token) vs admin_deleted (admin).
      security:
        - BearerSessionId: []
      responses:
        '204': { description: Session ended }
        '401': { description: Missing bearer }
        '403': { description: Bearer does not match session_id }
        '404': { description: Session not found }

  /v1/sessions/{sid}/events:
    parameters:
      - name: sid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [sessions]
      summary: "Browse the timeline of a persisted session"
      parameters:
        - in: query
          name: after_seq
          schema: { type: integer, minimum: 0 }
        - in: query
          name: before_seq
          schema: { type: integer, minimum: 0 }
        - in: query
          name: kind
          schema: { type: string }
          description: "Comma-separated list of event kinds"
        - in: query
          name: participant_id
          schema: { type: string }
          description: "Comma-separated list of participant_ids"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: "Page of events"
          content:
            application/json:
              schema:
                type: object
                required: [session_id, events, has_more, session_state]
                properties:
                  session_id: { type: string }
                  events:
                    type: array
                    items: { type: object }
                  next_cursor:
                    type: integer
                    nullable: true
                  has_more: { type: boolean }
                  session_state:
                    type: string
                    enum: [hot, cold, ended]
        "404":
          description: "Unknown session"
        "409":
          description: "Session is not persisted (no history)"

  /v1/sessions/{sid}/purpose:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [sessions]
      summary: Update the session's `purpose` (broadcasts session.purpose_updated)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePurposeRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { description: not_in_session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/sessions/{sid}/supervisor/notes:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [sessions]
      summary: Post a supervisor note / halt / continue / redirect
      description: |
        Authentication has four modes (mirrors the firehose
        endpoint's auth lattice):

        - **Admin-token mode** (recommended in multi-tenant
          deployments): the relay is started with
          ``SW_SUPERVISOR_ADMIN_TOKEN=<value>``; the bearer header
          must equal that value. Relay-wide operator authority.
        - **In-session participant**: bearer matches the
          ``participant_id`` of an active participant in this
          session. Lets an SDK orchestrator/supervisor role issue
          notes (kind=note/halt/continue/redirect) from inside the
          session.
        - **Per-session creator**: bearer matches the session's
          ``creator_token`` (when persistence + creator_token were
          set at create). Symmetric with the firehose WS auth so
          the cockpit's creator-role has supervisor power on both
          transports.
        - **Legacy mode** (default when the admin-token env var is
          unset): bearer must equal the ``session_id``. Suitable
          for local-dev cockpits; the relay logs a warning at
          startup advising operators to switch.

        Server-side invariants (all modes):
          - ``kind`` is restricted to the documented enum
            (``note`` / ``halt`` / ``continue`` / ``redirect``).
            Unknown kinds return 400.
          - ``target`` must equal ``"all"`` or a participant_id
            currently in the session roster.
          - Per-(session, source-ip) rate limit applies.
      security:
        - BearerSessionId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, target]
              properties:
                kind: { type: string, enum: [note, halt, continue, redirect] }
                target: { type: string, description: "'all' or a participant_id" }
                message: { type: string, maxLength: 2048 }
      responses:
        '200':
          description: Note delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  note_id: { type: string }
                  kind: { type: string }
                  target: { type: string }
                  message: { type: string, nullable: true }
                  ts_ms: { type: integer }
        '400': { description: Malformed request }
        '401': { description: Missing bearer }
        '403': { description: Bearer does not match session_id }
        '404': { description: Session not found }
        '429': { description: Rate-limited }

  /v1/sessions/{sid}/participants:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [participants]
      summary: Join a session
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinRequest' }
      responses:
        '201':
          description: Joined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinResponse' }
        '404':
          description: session_not_found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: session_full
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    get:
      tags: [participants]
      summary: List the session roster
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Roster
          content:
            application/json:
              schema:
                type: object
                properties:
                  roster:
                    type: array
                    items: { $ref: '#/components/schemas/ParticipantPublic' }
        '401':
          description: not_in_session
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/sessions/{sid}/participants/me:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [participants]
      summary: Update your participant record (broadcasts participant.updated)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSelfRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantPublic' }
    delete:
      tags: [participants]
      summary: Leave the session — optionally with structured `feedback`
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveRequest' }
      responses:
        '204':
          description: Left
        '413':
          description: payload_too_large (feedback over 4 KiB)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/sessions/{sid}/participants/me/inbox/drain:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [participants]
      summary: Drain pending events for the calling participant
      description: |
        Drain (and remove from the per-participant buffer) every
        notification queued for the calling participant. Each returned
        message carries an integer `seq` field (per-participant
        monotonically increasing). A client that has already consumed
        events up to ``seq=N`` over some other channel (typically a
        WebSocket that died mid-stream) can pass `?last_acked_seq=N`
        to skip those events on this drain.
      security:
        - bearerAuth: []
      parameters:
        - name: last_acked_seq
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: |
            Highest `seq` the caller has already consumed in memory.
            Buffered events with `seq <= last_acked_seq` are filtered
            out of the drained set. Invalid integers are ignored
            (full-drain fallback).
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxDrainResponse' }
        '401':
          description: not_in_session
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/sessions/{sid}/participants/me/inbox/wait:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [participants]
      summary: Blocking long-poll for events on the participant's inbox
      description: |
        Pull-mode only. Block until ≥1 buffered event matches the
        optional `names` filter (or `timeout_seconds` elapses), then
        return all matching events and re-buffer the rest. The
        response shape mirrors `inbox/drain` plus a `timed_out`
        flag distinguishing a real event delivery from a clean
        timeout.

        **Client-disconnect handling (relay 0.17.3+).** The relay
        polls the ASGI receive channel for `http.disconnect` events
        while the wait blocks. If the client closes the TCP
        connection before the server-side budget elapses (e.g. an
        HTTP client whose read timeout is shorter than
        `timeout_seconds`), the wait is cancelled, the participant's
        in-flight flag is cleared, and the relay returns
        HTTP `499 client_disconnect` — the client never sees the
        body, but the status code makes the log line unambiguous and
        a subsequent `inbox/wait` from the same participant proceeds
        normally instead of cascading with `409 wait_already_in_flight`.
        Set your HTTP client's read timeout to at least
        `timeout_seconds + a few seconds of slack` to avoid this
        signal turning into per-call churn.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboxWaitRequest' }
      responses:
        '200':
          description: Events or timeout (both success)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboxWaitResponse' }
        '400':
          description: invalid_payload
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: bearer does not match participant
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: session_not_found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: invalid_delivery_mode | wait_already_in_flight | participant_evicted
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: too_many_waits — relay concurrent-wait cap exceeded
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '499':
          description: |
            client_disconnect — the relay observed the client close the
            TCP connection before the wait completed and cancelled the
            wait so subsequent calls don't see `wait_already_in_flight`.
            The client never reads this body in practice.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/sessions/{sid}/participants/me/events:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
      - name: token
        in: query
        required: true
        schema: { type: string, format: uuid }
        description: |
          Bearer token (== participant_id in sub-project #1). Required
          here because browsers can't set custom headers on a WebSocket
          upgrade.
    get:
      tags: [participants]
      summary: WebSocket events stream — upgrade to wss/ws
      description: |
        Each frame is one JSON object `{"name": "<event>", "payload":
        {...}}` matching the inbox-drain schema. The relay drains any
        pending buffered events at attach time and forwards them over
        the socket before the live stream begins.

        On disconnect, in-flight events the relay had handed to the
        WS subscriber but couldn't actually deliver are pushed back to
        the per-participant buffer; reconnect or call `inbox/drain` to
        recover.
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)

  /v1/sessions/{sid}/firehose:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
      - name: token
        in: query
        required: true
        schema: { type: string }
        description: |
          Authentication token, required as a query param because
          browsers can't set custom headers on a WebSocket upgrade.

          Three modes (any one match accepts the connection):

          - **Admin-token mode** (recommended for multi-tenant
            deployments): when the relay is started with
            ``SW_FIREHOSE_ADMIN_TOKEN=<value>``, this query param
            may equal that value. Relay-wide operator credential —
            list/manage every session on the relay.
          - **Creator-token mode** (added in v0.17.0): the
            ``creator_token`` returned by ``session_create`` for
            *this* session is accepted as a session-scoped
            supervisor channel. The user who created the session
            has the right to observe every event in it (chat
            between other participants included) without holding
            the relay-wide admin token. Verified with a
            constant-time SHA-256 compare against the session's
            stored ``creator_token_hash``.
          - **Legacy SID mode** (default when the admin env var is
            unset): the token may equal the ``session_id``. Any
            session participant can subscribe and observe the full
            event stream. Suitable for local dev / single-tenant
            cockpit deployments only; the relay logs a warning at
            startup advising operators to switch to admin-token
            mode for multi-tenant production.
    get:
      tags: [sessions]
      summary: WebSocket — full event stream for the session (non-participant)
      description: |
        HTTP/WS upgrade. Authentication via the ``token`` query
        parameter — see the parameter description for the three
        accepted modes (admin / creator / legacy). Frames are JSON
        ``{name, payload}`` objects, matching the participant inbox
        shape.

        **Overlap semantics.** The firehose carries every event the
        relay fans out for this session. Per-participant subscribers
        (the ``/events`` WS, ``inbox/drain``, MCP push) receive only
        the events targeted at their participant_id. The two streams
        MAY overlap: a participant that opens its own ``/events`` WS
        AND subscribes to the firehose (it knows its own
        ``session_id``, which is the firehose token) will observe
        the same event on both channels. Consumers that subscribe to
        both MUST dedupe by event identity (``command_id`` for
        command-lifecycle events, ``participant_id`` + event name
        for participant events, etc.). The relay does NOT enforce
        disjointness.

        One concrete example: ``command.completed
        reason="sender_gone"`` is delivered both to the firehose and
        to each responder's per-participant inbox (since #51). A
        responder that also subscribes to the firehose will see the
        event twice and is expected to dedupe.
      responses:
        '101': { description: Switching Protocols (WebSocket) }

  /v1/sessions/{sid}/commands:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [commands]
      summary: Dispatch a command
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendCommandRequest' }
      responses:
        '201':
          description: Dispatched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendCommandResponse' }
        '413':
          description: payload_too_large
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: invalid_dispatch_filters / invalid_targets
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/sessions/{sid}/commands/{cid}/responses:
    parameters:
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [commands]
      summary: Respond to a command
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RespondCommandRequest' }
      responses:
        '201':
          description: Recorded
        '404':
          description: command_not_found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: already_responded
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: not_a_recipient
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
